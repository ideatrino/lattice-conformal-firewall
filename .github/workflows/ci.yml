name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Run test suite
        run: python tests/test_lcf.py
      - name: Run demonstrations (smoke test)
        run: |
          python demo.py > /dev/null
          python demo_live.py > /dev/null
          python demo_max.py > /dev/null
          python -m lcf.evaluate > /dev/null
